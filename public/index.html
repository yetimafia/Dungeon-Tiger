<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Tiger · GM</title>
<link rel="icon" href="/icon.png">
<style>
  :root { --bg:#14110f; --panel:#1e1a17; --line:#3a322b; --ink:#eae2d6; --dim:#9c8f80; --gold:#e0b354; --red:#d0574a; --green:#6fb46a; --blue:#6a9fd4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { margin:0; font:600 20px Georgia, serif; color:var(--gold); letter-spacing:.5px; }
  .pill { padding:2px 10px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--green); border-color:#355a33; } .pill.bad { color:var(--red); border-color:#5a3330; }
  main { display:grid; grid-template-columns: 250px 1fr 340px; gap:14px; padding:14px 18px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .card h2 { margin:0 0 8px; font:600 13px system-ui; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  button, select, input { font:inherit; color:var(--ink); background:#2a241f; border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
  button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--gold); } button:disabled { opacity:.4; cursor:default; }
  button.go { background:#3b2f17; border-color:#6b5426; color:var(--gold); }
  button.warn { border-color:#5a3330; color:#f0a59c; }
  section select, section input:not([type=number]) { max-width:100%; width:100%; }
  label { display:block; font-size:12px; color:var(--dim); margin:6px 0 2px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .runs div { padding:6px 8px; border-radius:7px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
  .runs div:hover { border-color:var(--line); } .runs div.sel { border-color:var(--gold); background:#26201a; }
  .runs small { color:var(--dim); display:block; }
  svg text { font:12px system-ui; fill:var(--ink); }
  #log { height:320px; overflow:auto; font-size:14px; } #log p { margin:0 0 6px; } #log b { color:var(--gold); }
  .hero { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:7px 0; border-bottom:1px solid var(--line); }
  .hero:last-child { border:0; } .hero .name { font-weight:600; } .hero .sub { color:var(--dim); font-size:12px; grid-column:1 / -1; }
  .hp { grid-column:1 / -1; height:7px; background:#2c2420; border-radius:4px; overflow:hidden; }
  .hp i { display:block; height:100%; background:var(--green); }
  .hero.turn { background:linear-gradient(90deg, #3b2f1744, transparent); }
  .dead { opacity:.45; text-decoration:line-through; }
  .foe { display:flex; justify-content:space-between; align-items:center; padding:3px 0; cursor:pointer; }
  .fn { display:flex; align-items:center; gap:8px; }
  .spr { width:48px; height:48px; image-rendering:pixelated; background:#2a231d; border-radius:6px; }
  .foe.gone .spr { filter:grayscale(1) brightness(.5); }
  .bf { position:relative; width:100%; max-width:calc(var(--bw) * 64px); margin:0 auto; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .bf img { width:100%; display:block; image-rendering:pixelated; }
  .bf .cells { position:absolute; left:0; right:0; bottom:0; display:grid; }
  .bf .cells div { cursor:default; } .bf .cells div.r { cursor:pointer; } .bf .cells div.r:hover { background:#78c8ff40; }
  .bf .cells div.f { cursor:crosshair; } .bf .cells div.f:hover { outline:2px solid #ff6a5a; outline-offset:-2px; }
  .hspr { width:32px; height:32px; image-rendering:pixelated; vertical-align:middle; margin-right:6px; background:#2a231d; border-radius:4px; }
  .lineup { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:6px 0 10px; }
  .lineup img { width:80px; height:80px; image-rendering:pixelated; background:#2a231d; border-radius:8px; }
  .lineup img.gone { filter:grayscale(1) brightness(.45); } .foe.sel { color:var(--gold); }
  .foe.gone { opacity:.35; text-decoration:line-through; cursor:default; }
  .empty { color:var(--dim); text-align:center; padding:40px 10px; }
  .set label { margin-top:10px; } .set input[type=text], .set input[type=password], .set select { width:100%; }
  .set .hint { color:var(--dim); font-size:12px; margin:2px 0 0; }
  .set .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .upd { background:#2b3b1c; border:1px solid #4d7a2e; color:#cfe8b4; }
  .banner { padding:10px 14px; border-radius:8px; margin-bottom:12px; background:#26201a; border:1px solid var(--gold); }
  .spell { display:inline-block; }

  /* pixel-art look, shared with Note Tiger */
  @font-face { font-family: "Pixelify Sans"; src: url(/fonts/pixelify-sans-400.woff2) format("woff2"); font-weight: 400 500; font-display: swap; }
  @font-face { font-family: "Pixelify Sans"; src: url(/fonts/pixelify-sans-700.woff2) format("woff2"); font-weight: 600 800; font-display: swap; }
  body { background-image: linear-gradient(45deg, #ffffff05 25%, transparent 25%, transparent 75%, #ffffff05 75%), linear-gradient(45deg, #ffffff05 25%, transparent 25%, transparent 75%, #ffffff05 75%);
    background-size: 8px 8px; background-position: 0 0, 4px 4px; }
  header { background: var(--panel); border-bottom: 3px solid #0b0807; box-shadow: 0 3px 0 #2a231d; }
  header h1 { font-family: "Pixelify Sans", Georgia, serif; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 34px; height: 34px; image-rendering: pixelated; }
  .card h2, .banner, button { font-family: "Pixelify Sans", system-ui, sans-serif; }
  .card h2 { font-size: 15px; letter-spacing: 1px; }
  .card { border: 2px solid #0b0807; box-shadow: 4px 4px 0 #0b0807, inset 0 0 0 1px var(--line); border-radius: 3px; }
  button { font-size: 15px; border: 2px solid #0b0807; border-radius: 2px; box-shadow: inset -3px -3px 0 #0000003d, inset 3px 3px 0 #ffffff1f, 2px 2px 0 #0b0807; }
  button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: inset -3px -3px 0 #0000003d, inset 3px 3px 0 #ffffff1f; }
  button.go { background: #f08a24; color: #1a0f05; } button.upd { background: #6fd47a; color: #0c1a0e; }
  input, select { border: 2px solid var(--line); border-radius: 2px; background: #0f0d0b; }
  .pill { border-radius: 2px; border-width: 2px; }
  .bf { border: 2px solid #0b0807; box-shadow: 4px 4px 0 #0b0807; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1><img src="/icon.png" alt="">Dungeon Tiger</h1>
  <span id="nt" class="pill">Note Tiger…</span>
  <span id="dc" class="pill">Discord…</span>
  <span id="upd"></span>
  <span style="flex:1"></span>
  <span id="ver" class="pill"></span>
  <button onclick="openSettings()">⚙️ Settings</button>
</header>
<main>
  <section>
    <div class="card">
      <h2>New run</h2>
      <label>Party size</label><input id="size" type="number" min="1" max="6" value="4" style="width:70px">
      <label>Level</label><input id="level" type="number" min="1" max="10" value="3" style="width:70px">
      <label>Rules</label><select id="edition"><option>2024</option><option>2014</option></select>
      <label>Who plays</label>
      <select id="mode"><option value="test">Test run (plays itself)</option><option value="table">At the table (you choose each action)</option></select>
      <div class="row" style="margin-top:10px"><button class="go" onclick="newRun()">Start a run</button></div>
      <p style="color:var(--dim);font-size:12px;margin:8px 0 0">Discord runs start with <code>/dungeon start</code> and show up here too.</p>
    </div>
    <div class="card" id="onlineCard"><h2>Players' website</h2><p class="hint">Loading…</p></div>
    <div class="card"><h2>Monsters</h2><a href="/sprites" target="_blank" style="color:var(--gold)">See all the monster sprites →</a></div>
    <div class="card"><h2>Runs</h2><div id="runs" class="runs"><div class="empty" style="padding:10px">None yet</div></div></div>
  </section>
  <section id="center-wrap"><div id="first"></div><div id="settings" class="card" style="display:none"></div><section id="center"><div class="card empty">Start a run, or pick one on the left.</div></section>
  </section>
  <section id="right"></section>
</main>
<script>
let aim = null;
let sel = location.hash.slice(1) && location.hash !== '#settings' ? location.hash.slice(1) : null, data = null, target = null, busy = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
async function api(path, body) {
  const r = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
async function act(path, body = {}) {
  if (busy) return; busy = true;
  try { await api(`runs/${sel}/${path}`, body); } catch (e) { alert(e.message); }
  busy = false; tick();
}
async function newRun() {
  try {
    const r = await api('runs', { size: $('size').value, level: $('level').value, edition: $('edition').value, mode: $('mode').value });
    sel = r.id; if (r.usedLocal) alert('Note Tiger wasn\'t reachable, so the party is simple stand-in characters (no Party tab, no recap).');
    refresh(); tick();
  } catch (e) { alert(e.message); }
}
async function update() {
  if (!confirm('Download and install the update now? Dungeon Tiger will close and reopen in about a minute. Runs in progress are lost.')) return;
  try { await api('update/install', {}); } catch (e) { alert(e.message); }
  refresh();
}
async function link() {
  try { await api('settings/link', {}); $('first').dataset.closed = 1; await refresh(true); } catch (e) { alert(e.message); }
}
const FIELDS = [
  ['Note Tiger', [
    ['NOTE_TIGER_URL', 'Address', 'text', 'From Note Tiger → Settings → Connections. On this PC: http://localhost:3081/v1'],
    ['NOTE_TIGER_KEY', 'Key', 'password', 'From Note Tiger → Settings → Connections'],
    ['NOTE_TIGER_SERVER', 'Discord server ID (optional)', 'text', 'Whose characters, books and #recaps to use. Empty = Note Tiger\'s first server.'],
  ]],
  ['Discord bot', [
    ['DISCORD_TOKEN', 'Bot token', 'password', 'The Dungeon Tiger bot\'s own token (not Note Tiger\'s). Discord Developer Portal → your app → Bot → Reset Token.'],
    ['TURN_SECONDS', 'Seconds to choose an action', 'number', 'Then the game plays the turn for them.'],
  ]],
  ['Game', [
    ['EDITION', 'D&D rules', ['2024', '2014'], ''],
    ['KEEP_CHARACTERS', 'Keep random characters in Note Tiger after a run', ['false', 'true'], ''],
  ]],
  ['Players\' website', [
    ['PLAYER_PASSWORD', 'Players\' password (optional)', 'password', 'Lets players log in at the site\'s address without the join link. Leave empty to allow join links only.'],
    ['PLAYER_PORT', 'Players\' site port', 'number', 'Changing it needs a restart.'],
  ]],
  ['This app', [
    ['PORT', 'GM page port', 'number', 'Changing it needs a restart.'],
    ['GM_LAN', 'Let other computers on my network open the GM page', ['false', 'true'], 'Changing it needs a restart.'],
    ['UPDATE_CHECK', 'Check for updates', ['true', 'false'], ''],
  ]],
];
async function openSettings() {
  const st = await api('settings');
  const u = await api('update');
  const field = ([k, label, type, hint]) => `<label>${label}</label>${Array.isArray(type)
    ? `<select data-k="${k}">${type.map((o) => `<option ${st.values[k] === o ? 'selected' : ''} value="${o}">${{ true: 'Yes', false: 'No' }[o] || o}</option>`).join('')}</select>`
    : `<input type="${type}" data-k="${k}" value="${esc(st.values[k])}" placeholder="${type === 'password' ? (st.set[k] ? '•••••••• (saved; type to replace)' : 'not set') : ''}">`}${hint ? `<p class="hint">${hint}</p>` : ''}`;
  $('settings').style.display = '';
  $('settings').innerHTML = `<div class="set"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Settings</h2><button onclick="$('settings').style.display='none'">✕</button></div>
    ${st.noteTigerOnPC.found ? `<p class="hint" style="margin-top:8px">Note Tiger is installed on this PC${st.noteTigerOnPC.linked ? ' and linked ✓' : ''}. <a href="#" onclick="link();openSettings();return false" style="color:var(--gold)">${st.noteTigerOnPC.linked ? 'Link again' : 'Link it for me'}</a> (turns on its connection and copies the key here).</p>` : ''}
    ${FIELDS.map(([title, fs]) => `<h2 style="margin-top:16px">${title}</h2>${fs.map(field).join('')}`).join('')}
    <div class="row" style="margin-top:14px"><button class="go" onclick="saveSettings()">Save</button><span id="saved" style="color:var(--dim)"></span></div>
    <h2 style="margin-top:18px">Updates</h2><p style="margin:0 0 6px">You have <b>${esc(u.current)}</b>.${u.latest ? ` The newest is <b>${esc(u.latest)}</b>.` : ''} ${u.error ? esc(u.error) : ''}</p>
    <div class="row"><button onclick="checkUpd()">Check for updates</button>${u.newer ? `<button class="upd" onclick="update()">⬆️ Update to ${esc(u.latest)}</button>` : ''}</div></div>`;
  window.scrollTo(0, 0);
}
async function saveSettings() {
  const body = {};
  document.querySelectorAll('#settings [data-k]').forEach((el) => { body[el.dataset.k] = el.value; });
  try {
    const r = await api('settings', body);
    $('saved').textContent = r.needsRestart ? 'Saved. Restart Dungeon Tiger for the port/network change.' : 'Saved ✓';
    if (r.needsRestart && r.canRestart && confirm('Restart Dungeon Tiger now?')) { await api('restart', {}); setTimeout(() => location.reload(), 6000); }
    refresh(true);
  } catch (e) { alert(e.message); }
}
async function checkUpd() { await api('update/check', {}); openSettings(); refresh(); }
async function onlineCard() {
  let o;
  try { o = await api('online'); } catch { return; }
  const local = `http://localhost:${o.port}/#t=${o.token}`;
  const st = { off: 'Offline: only this PC can open it.', downloading: 'Downloading Cloudflare\'s tunnel (first time only)…', starting: 'Going online…', online: '🟢 Online', error: `⚠️ ${esc(o.error)}` }[o.state] || o.state;
  const pub = o.publish || {};
  $('onlineCard').innerHTML = `<h2>Players' website</h2>
    <p style="margin:0 0 6px">${st}</p>
    ${o.state === 'online' ? `<p class="hint" style="margin:0 0 6px">${pub.state === 'published' ? `Posted on Note Tiger's player website${pub.siteUrl ? ` (<a href="${esc(pub.siteUrl)}" target="_blank" style="color:var(--gold)">open</a>)` : ''}: players unlock it with the group password and tap <b>Join the dungeon</b>.` : pub.state === 'sending' ? 'Posting the link on Note Tiger\'s player website…' : pub.error ? esc(pub.error) : ''}</p>
      <label>Or share this join link</label><div class="row"><input id="jl" value="${esc(o.joinLink)}" readonly style="flex:1" onclick="this.select()"><button onclick="navigator.clipboard.writeText($('jl').value)">Copy</button></div>
      ${o.passwordSet ? '<p class="hint">The site address alone also works with the players\' password from Settings.</p>' : ''}` : ''}
    <div class="row" style="margin-top:8px">${o.state === 'off' || o.state === 'error' ? '<button class="go" onclick="online(\'start\')">🌐 Go online</button>' : '<button onclick="online(\'stop\')">Go offline</button>'}
      <button onclick="if(confirm('Make a new join link? Links shared before stop working.'))online('newlink')">New link</button>
      <a href="${local}" target="_blank" style="color:var(--gold);align-self:center">Open it here</a></div>
    <p class="hint">${o.players} logged in. The players' site runs on this PC: it's online while Dungeon Tiger is open.</p>`;
}
async function online(what) { try { await api(`online/${what}`, {}); } catch (e) { alert(e.message); } onlineCard(); }
setInterval(onlineCard, 3000); setTimeout(onlineCard, 300);
async function refresh(check) {
  const s = await api('state' + (check ? '?check=1' : ''));
  $('nt').className = 'pill ' + (s.noteTiger.ok ? 'ok' : 'bad');
  $('nt').textContent = s.noteTiger.ok ? 'Note Tiger connected' : `Note Tiger: ${s.noteTiger.hasKey ? (s.noteTiger.error || 'not checked') : 'no key set'}`;
  const dc = s.discord || {};
  $('dc').className = 'pill ' + (dc.state === 'on' ? 'ok' : dc.state === 'error' ? 'bad' : '');
  $('dc').textContent = dc.state === 'on' ? `Discord bot online${dc.name ? ` (${dc.name})` : ''}` : dc.state === 'starting' ? 'Discord bot starting…' : dc.state === 'error' ? `Discord bot: ${dc.error}` : 'Discord bot off (no token)';
  $('ver').textContent = 'v' + s.version;
  const u = s.update || {};
  $('upd').innerHTML = u.download?.state === 'downloading' ? `<span class="pill">Downloading update… ${u.download.total ? Math.round(100 * u.download.got / u.download.total) : 0}%</span>`
    : u.download?.state === 'starting' ? '<span class="pill">Installing the update: Dungeon Tiger will close and reopen</span>'
    : u.newer ? `<button class="upd" onclick="update()">⬆️ Update to ${esc(u.latest)}</button>` : '';
  $('first').innerHTML = !s.noteTiger.ok && !s.noteTiger.hasKey && !$('first').dataset.closed ? `<div class="card" style="border-color:var(--gold)"><h2>Link up with Note Tiger</h2>
    <p style="margin:0 0 8px">Dungeon Tiger gets its random characters, rules answers and recaps from Note Tiger. ${s.noteTigerOnPC?.found ? 'Note Tiger is installed on this PC: one click links them.' : 'Note Tiger isn\'t installed on this PC: open Settings and paste its address and key (Note Tiger → Settings → Connections).'}</p>
    <div class="row">${s.noteTigerOnPC?.found ? '<button class="go" onclick="link()">🔗 Link Note Tiger</button>' : ''}<button onclick="openSettings()">⚙️ Settings</button><button onclick="$(\'first\').dataset.closed=1;refresh()">Not now</button></div></div>` : '';
  $('edition').value = $('edition').dataset.set ? $('edition').value : s.edition; $('edition').dataset.set = 1;
  $('runs').innerHTML = s.runs.length ? s.runs.slice().reverse().map((r) => `<div class="${r.id === sel ? 'sel' : ''}" onclick="sel='${r.id}';location.hash=sel;target=null;refresh();tick()">
    ${esc(r.title)} <small>${{ discord: '💬 Discord', table: '🎲 table', test: '🤖 test' }[r.source] || r.source} · ${r.state === 'ended' ? esc(r.outcome) : `floor ${r.floor}, ${r.state}`}</small></div>`).join('') : '<div class="empty" style="padding:10px">None yet</div>';
}
function mapSvg(d) {
  const W = 104, H = 80, bw = 78, bh = 50;
  const box = (r) => { const dw = r.dims ? 40 + (r.dims.w - 7) / 9 * 50 : bw, dh = r.dims ? 30 + (r.dims.h - 5) / 5 * 26 : bh; return { x: r.x * W + 10 + (bw - dw) / 2, y: r.y * H + 10 + (bh - dh) / 2, w: dw, h: dh }; };
  const seen = d.rooms.filter((r) => r.seen || r.visited);
  const icon = { fight: '⚔️', stairs: '🪜', boss: '💀', rest: '🛏️', treasure: '💰', trap: '🪤', empty: '', start: '📍', '?': '?' };
  let lines = '', boxes = '';
  const at = (id) => d.rooms.find((r) => r.id === id);
  for (const r of seen) for (const [dir, to] of Object.entries(r.exits)) {
    if (dir !== 'e' && dir !== 's') continue; const o = at(to); if (!(o.seen || o.visited) || !(r.visited || o.visited)) continue;
    lines += `<line x1="${r.x * W + bw / 2 + 10}" y1="${r.y * H + bh / 2 + 10}" x2="${o.x * W + bw / 2 + 10}" y2="${o.y * H + bh / 2 + 10}" stroke="#5c4f42" stroke-width="5"/>`;
  }
  for (const r of seen) {
    const here = r.id === d.here, done = r.cleared || r.kind === 'empty' || r.kind === 'start';
    const fill = here ? '#4a3a1c' : r.visited ? '#2a231d' : '#1b1714';
    const bx = box(r);
    boxes += `<g><rect x="${bx.x}" y="${bx.y}" width="${bx.w}" height="${bx.h}" rx="6" fill="${fill}" stroke="${here ? '#e0b354' : r.visited ? '#5c4f42' : '#3a322b'}" ${r.visited ? '' : 'stroke-dasharray="4 3"'} stroke-width="${here ? 2.5 : 1.5}"/>
      <text x="${r.x * W + 10 + bw / 2}" y="${r.y * H + 10 + bh / 2 + 5}" text-anchor="middle" style="font-size:${here ? 13 : 16}px;opacity:${r.visited && done && r.kind !== 'stairs' && !(r.kind === 'rest' && !r.rested) ? .45 : 1}">${here ? '🧙 you' : r.visited ? (r.kind === 'treasure' && r.looted ? '' : icon[r.kind] || '') : (r.kind === 'stairs' || r.kind === 'boss' ? icon[r.kind] : '?')}</text></g>`;
  }
  return `<svg viewBox="0 0 ${5 * W + 14} ${4 * H + 14}" style="width:100%;max-height:360px">${lines}${boxes}</svg>`;
}
function battleView(d) {
  const b = d.battle, reach = new Set(d.actions ? b.reach : []);
  const at = {};
  for (const u of b.units) for (let j = 0; j < u.fp; j++) for (let i = 0; i < u.fp; i++) at[`${u.bx + i},${u.by + j}`] = u;
  let cells = '';
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    const k = `${x},${y}`, u = at[k];
    const cls = u && u.side === 'm' ? 'f' : reach.has(k) && !u ? 'r' : '';
    cells += `<div class="${aim ? 'r' : cls}" data-x="${x}" data-y="${y}" title="${u ? esc(`${u.tag} ${u.name}`) : ''}" onclick="cell(${x},${y})" ${aim ? `onmouseenter="aimAt(${x},${y})"` : ''}></div>`;
  }
  const v = `${d.log.length}-${d.turn?.id}-${b.steps}-${target}`;
  return `<div class="bf" style="--bw:${b.w}"><img src="/api/runs/${d.id}/battle.png?target=${target || ''}&v=${encodeURIComponent(v)}" alt="Battle map"><div class="cells" style="top:${100 / (b.h + 1)}%;grid-template-columns:repeat(${b.w},1fr);grid-template-rows:repeat(${b.h},1fr)">${cells}</div></div>`;
}
function aimAt(x, y) {
  document.querySelectorAll('.bf .cells div').forEach((c) => {
    const on = aim && Math.max(Math.abs(c.dataset.x - x), Math.abs(c.dataset.y - y)) <= aim.radius;
    c.style.background = on ? '#ff7a3a55' : '';
  });
}
function cell(x, y) {
  if (!data?.battle) return;
  const u = data.battle.units.find((u) => x >= u.bx && x < u.bx + u.fp && y >= u.by && y < u.by + u.fp);
  if (aim) { const s = aim; aim = null; return act('act', { heroId: s.heroId, type: 'cast', spell: s.name, at: [x, y] }); }
  if (u && u.side === 'm') { target = u.id; return render(data); }
  if (data.actions && data.battle.reach.includes(`${x},${y}`) && !u) act('act', { heroId: data.actions.heroId, type: 'move', to: [x, y] });
}
function render(d) {
  const ex = d.rooms.find((r) => r.id === d.here);
  const room = ex;
  const fight = d.state === 'combat';
  let ctrl = '';
  if (d.state === 'explore') {
    const dir = (k, l) => `<button ${room.exits[k] ? '' : 'disabled'} onclick="act('move',{dir:'${k}'})">${l}</button>`;
    ctrl = `<div class="row">${dir('n', '⬆️ North')}${dir('w', '⬅️ West')}${dir('e', '➡️ East')}${dir('s', '⬇️ South')}</div>
      <div class="row" style="margin-top:8px">
        <button class="go" onclick="act('loot')">💰 Take loot</button>
        <button onclick="act('rest')">🛏️ Rest (safe room)</button><button onclick="act('breather')">☕ Short rest</button>
        <button class="go" onclick="act('down')">🪜 Go down</button>
        <button onclick="act('step')">👣 Let the game take a step</button></div>`;
  } else if (fight && d.actions) {
    const a = d.actions, foes = d.foes.filter((f) => f.hp > 0);
    if (!foes.some((f) => f.id === target)) target = foes.sort((x, y) => x.hp - y.hp)[0]?.id;
    const H = `heroId:'${a.heroId}'`;
    ctrl = `<p style="margin:0 0 8px"><b>${esc(d.turn.name)}'s turn</b>: ${a.steps} squares of movement left${a.acted ? ', action used' : ''}. ${aim ? `<b style="color:var(--gold)">Click a square to aim ${esc(aim.name)}</b> (everyone in the blast is hit, friends too). <a href="#" onclick="aim=null;render(data);return false" style="color:var(--gold)">Cancel</a>` : 'Click a blue square to move, a monster to target it, then pick an action. Actions walk you closer by themselves.'}</p>
      ${a.acted ? '' : `<div class="row">${a.weapons.map((w) => `<button class="go" onclick="act('act',{${H},type:'attack',weapon:${esc(JSON.stringify(w.name))},target})">⚔️ ${esc(w.name)} <small>${esc(w.text)}</small></button>`).join('')}</div>
      <div class="row" style="margin-top:6px">${a.spells.map((s) => `<button ${s.ok ? '' : 'disabled'} onclick="${s.aoe && !s.self ? `aim=${esc(JSON.stringify({ name: s.name, radius: s.radius, heroId: a.heroId }))};render(data)` : `act('act',{${H},type:'cast',spell:${esc(JSON.stringify(s.name))},target})`}">✨ ${esc(s.name)} <small>${s.level || 'c'}${s.heal ? ' 💚' : s.aoe ? ' 💥' : ''}</small></button>`).join('')}</div>
      <div class="row" style="margin-top:6px"><button onclick="act('act',{${H},type:'dodge'})">🛡️ Dodge</button>
      <button onclick="act('act',{${H},type:'dash'})">💨 Dash</button><button onclick="act('act',{${H},type:'disengage'})">🏃 Disengage</button>
      <button ${a.potions ? '' : 'disabled'} onclick="act('act',{${H},type:'potion'})">🧪 Potion (${a.potions})</button>
      <button onclick="act('auto')">🤖 Play it for me</button></div>`}
      <div class="row" style="margin-top:6px"><button class="go" onclick="act('act',{${H},type:'end'})">⏭ End turn</button></div>`;
  } else if (fight) ctrl = `<p style="color:var(--dim);margin:0">Waiting for ${esc(d.turn?.name || '…')}${d.source === 'discord' ? ' in Discord' : ''}.</p>`;
  const ended = d.state === 'ended' ? `<div class="banner">🏁 ${esc(d.outcome)}${d.recap ? `<br><small>${{ writing: '📝 Sent to Note Tiger: the recap will show up in #recaps.', sending: 'Sending to Note Tiger…', failed: 'Couldn\'t send to Note Tiger: ' + esc(d.recap.error), off: 'Note Tiger isn\'t connected, so no recap.' }[d.recap.status] || ''}</small>` : ''}</div>` : '';
  const bf = fight && d.battle ? battleView(d) : '';
  $('center').innerHTML = `${ended}<div class="card"><h2>Floor ${d.floor} of ${d.floors}: ${esc(d.floorName)} ${fight ? `· ⚔️ round ${d.round}` : ''}</h2>${bf || mapSvg(d)}
    <p style="margin:4px 0 10px;color:var(--dim)">📍 ${esc(room.name)}</p>${d.state === 'ended' ? '' : ctrl}</div>
    <div class="card"><h2>What happened</h2><div id="log">${d.log.map((l) => `<p>${md(l)}</p>`).join('')}</div></div>`;
  $('log').scrollTop = 1e6;
  const heroes = d.heroes.map((h) => `<div class="hero ${d.turn?.id === h.id ? 'turn' : ''}"><span class="name ${h.dead ? 'dead' : ''}"><img class="hspr" src="/api/runs/${d.id}/hero/${encodeURIComponent(h.id)}.png">${h.tag && fight ? `<small style="color:var(--blue)">${h.tag}</small> ` : ''}${esc(h.name)}</span><span>${h.dead ? '💀' : h.down ? `🩸 ${h.ds.s}✓ ${h.ds.f}✗` : `${h.hp}/${h.maxHp}`} · AC ${h.ac}</span>
    <div class="hp"><i style="width:${Math.max(0, 100 * h.hp / h.maxHp)}%;background:${h.hp / h.maxHp < .3 ? 'var(--red)' : h.hp / h.maxHp < .6 ? 'var(--gold)' : 'var(--green)'}"></i></div>
    <span class="sub">${esc(h.cls)}${h.playerName ? ` · ${esc(h.playerName)}` : ' · 🤖'}${h.potions ? ` · 🧪${h.potions}` : ''}${Object.keys(h.slots).length ? ` · slots ${Object.entries(h.slots).filter(([, s]) => s.max).map(([l, s]) => `${l}:${s.max - (s.used || 0)}`).join(' ')}` : ''}${h.gold ? ` · ${h.gold} gp` : ''}${h.items.length ? ` · ${esc(h.items.join(', '))}` : ''}</span></div>`).join('');
  const foes = fight ? `<div class="card"><h2>Foes</h2>${d.foes.map((f) => `<div class="foe ${f.hp <= 0 ? 'gone' : f.id === target ? 'sel' : ''}" onclick="${f.hp > 0 ? `target='${f.id}';tick()` : ''}"><span class="fn"><img class="spr" src="/sprite/${encodeURIComponent(f.n)}.png" alt="">${f.id === target ? '🎯 ' : ''}<small style="color:var(--red)">${f.tag || ''}</small> ${esc(f.name)}</span><span>${f.hp}/${f.maxHp} · AC ${f.ac}</span></div>`).join('')}</div>` : '';
  $('right').innerHTML = `<div class="card"><h2>Party · ${d.gold} gold found</h2>${heroes}</div>${foes}
    <div class="card"><h2>GM</h2><div class="row">
      ${d.state === 'ended' ? '' : `<button onclick="act('autoplay',{on:${!d.autoplaying}})">${d.autoplaying ? '⏸ Stop auto-play' : '▶ Auto-play'}</button>
      <button onclick="act('heal')">💚 Heal party</button><button ${fight ? '' : 'disabled'} onclick="act('skip')">⏭ Skip this fight</button>
      <button ${d.floor < d.floors ? '' : 'disabled'} onclick="act('nextfloor')">🪜 Next floor</button>
      <button class="warn" onclick="if(confirm('End this run?'))act('end')">End run</button>`}</div></div>`;
}
async function tick() {
  if (!sel) return;
  try { data = await api(`runs/${sel}`); render(data); } catch (e) { $('center').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; sel = null; }
}
refresh(true); setInterval(tick, 1000); setInterval(refresh, 4000);
if (location.hash === '#settings') openSettings();
</script>
</body>
</html>
